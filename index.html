<script type="text/babel">
const { useState, useEffect } = React;

function ImageSlider({ images, defaultImage }) {
  const [current, setCurrent] = useState(0);
  if (!images || images.length === 0) {
    return <div style={{fontSize: '4rem'}}>{defaultImage || '📦'}</div>;
  }
  if (images.length === 1) {
    const img = images[0];
    return img && img.startsWith('data:image') ?
      <img src={img} alt="منتج" style={{width: '100%', height: '100%', objectFit: 'cover', borderRadius: '8px'}} /> :
      <div style={{fontSize: '4rem'}}>{img || defaultImage || '📦'}</div>;
  }
  return (
    <div style={{position: 'relative', width: '100%', height: '100%'}}>
      {images.map((img, i) => (
        <div key={i} style={{
          position: 'absolute', top: 0, left: 0, width: '100%', height: '100%',
          opacity: i === current ? 1 : 0, transition: 'opacity 0.3s',
          display: 'flex', alignItems: 'center', justifyContent: 'center'
        }}>
          {img && img.startsWith('data:image') ?
            <img src={img} alt={`صورة ${i+1}`} style={{width: '100%', height: '100%', objectFit: 'cover', borderRadius: '8px'}} /> :
            <span style={{fontSize: '4rem'}}>{img}</span>
          }
        </div>
      ))}
      <button onClick={() => setCurrent((current - 1 + images.length) % images.length)} style={{
        position: 'absolute', top: '50%', right: '5px', transform: 'translateY(-50%)',
        background: 'rgba(0,0,0,0.5)', color: 'white', border: 'none',
        width: '30px', height: '30px', borderRadius: '50%', cursor: 'pointer',
        fontSize: '1.2rem', zIndex: 2
      }}>‹</button>
      <button onClick={() => setCurrent((current + 1) % images.length)} style={{
        position: 'absolute', top: '50%', left: '5px', transform: 'translateY(-50%)',
        background: 'rgba(0,0,0,0.5)', color: 'white', border: 'none',
        width: '30px', height: '30px', borderRadius: '50%', cursor: 'pointer',
        fontSize: '1.2rem', zIndex: 2
      }}>›</button>
      <div style={{
        position: 'absolute', bottom: '10px', left: '50%', transform: 'translateX(-50%)',
        display: 'flex', gap: '0.3rem', background: 'rgba(0,0,0,0.5)',
        padding: '0.3rem 0.5rem', borderRadius: '10px', zIndex: 2
      }}>
        {images.map((_, i) => (
          <button key={i} onClick={() => setCurrent(i)} style={{
            width: '8px', height: '8px', borderRadius: '50%',
            background: i === current ? 'white' : 'rgba(255,255,255,0.5)',
            border: 'none', cursor: 'pointer', padding: 0
          }} />
        ))}
      </div>
    </div>
  );
}

function ExpiryBadge({ expiryDate }) {
  if (!expiryDate) return null;
  const today = new Date();
  const expiry = new Date(expiryDate);
  const diffDays = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
  let className = 'product-badge ';
  let text = '';
  if (diffDays < 0) {
    className += 'badge-danger';
    text = '⚠️ منتهي الصلاحية';
  } else if (diffDays <= 30) {
    className += 'badge-warning';
    text = `⏰ ينتهي خلال ${diffDays} يوم`;
  } else if (diffDays <= 90) {
    className += 'badge-info';
    text = `📅 ${expiry.toLocaleDateString('ar-IQ')}`;
  } else {
    className += 'badge-success';
    text = `✓ ${expiry.toLocaleDateString('ar-IQ')}`;
  }
  return <span className={className}>{text}</span>;
}

  const handleImageUpload = (e) => {
    const files = Array.from(e.target.files);
    const maxFiles = 10, maxSizePerFile = 10 * 1024 * 1024;
    const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif'];
    if (newProduct.images.length + files.length > maxFiles) { alert(`⚠️ الحد الأقصى للصور هو ${maxFiles} صورة`); return; }
    setIsUploadingImages(true); setUploadProgress(0);
    let processedCount = 0, errorMessages = [];
    files.forEach((file, index) => {
      if (!allowedTypes.includes(file.type)) { errorMessages.push(`الملف ${file.name}: نوع غير مدعوم`); processedCount++; setUploadProgress(Math.round((processedCount / files.length) * 100)); if (processedCount === files.length) { setIsUploadingImages(false); if (errorMessages.length > 0) alert('⚠️ بعض الملفات لم يتم رفعها:\n' + errorMessages.join('\n')); } return; }
      if (file.size > maxSizePerFile) { errorMessages.push(`الملف ${file.name}: حجم كبير جداً (الحد الأقصى 10MB)`); processedCount++; setUploadProgress(Math.round((processedCount / files.length) * 100)); if (processedCount === files.length) { setIsUploadingImages(false); if (errorMessages.length > 0) alert('⚠️ بعض الملفات لم يتم رفعها:\n' + errorMessages.join('\n')); } return; }
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          const maxDimension = 2048;
          if (width > height) { if (width > maxDimension) { height = (height * maxDimension) / width; width = maxDimension; } }
          else { if (height > maxDimension) { width = (width * maxDimension) / height; height = maxDimension; } }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, width, height);
          const compressedImage = canvas.toDataURL(file.type, 0.95);
          setNewProduct(prev => ({ ...prev, images: [...prev.images, compressedImage], imagePreviews: [...prev.imagePreviews, compressedImage] }));
          processedCount++; setUploadProgress(Math.round((processedCount / files.length) * 100));
          if (processedCount === files.length) { setIsUploadingImages(false); const successCount = files.length - errorMessages.length; if (successCount > 0) alert(`✅ تم رفع ${successCount} صورة بنجاح بجودة عالية!`); if (errorMessages.length > 0) alert('⚠️ بعض الملفات لم يتم رفعها:\n' + errorMessages.join('\n')); }
        };
        img.onerror = () => { errorMessages.push(`الملف ${file.name}: فشل في تحميل الصورة`); processedCount++; setUploadProgress(Math.round((processedCount / files.length) * 100)); if (processedCount === files.length) { setIsUploadingImages(false); if (errorMessages.length > 0) alert('⚠️ بعض الملفات لم يتم رفعها:\n' + errorMessages.join('\n')); } };
        img.src = event.target.result;
      };
      reader.onerror = () => { errorMessages.push(`الملف ${file.name}: فشل في قراءة الملف`); processedCount++; setUploadProgress(Math.round((processedCount / files.length) * 100)); if (processedCount === files.length) { setIsUploadingImages(false); if (errorMessages.length > 0) alert('⚠️ بعض الملفات لم يتم رفعها:\n' + errorMessages.join('\n')); } };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  };

              <div className="user-info">🏪 {currentBuyer.storeName}</div>
              <button className="btn" style={{background: '#2e7d32', color: 'white', padding: '0.5rem 1rem', fontSize: '0.9rem'}} onClick={openEditProfile}>⚙️ الإعدادات</button>
              <button className="btn btn-secondary" onClick={buyerLogout} style={{padding: '0.5rem 1rem', fontSize: '0.9rem'}}>خروج</button>
            </div>
          ) : (
            <div style={{display: 'flex', gap: '0.5rem'}}>
              <button className="nav-tab" style={{background: 'rgba(255,255,255,0.3)', fontWeight: 'bold'}} onClick={() => { setShowBuyerAuth(true); setBuyerAuthMode('login'); }}>🏪 دخول المتجر</button>
              <button className="nav-tab" onClick={() => setShowAuthModal(true)}>🏭 دخول المورد</button>
            </div>
          )}
        </div>
      </header>
      <div className="container">
        <div className="section">
          <h2>🎉 تم الاتصال بـ Supabase بنجاح!</h2>
          <p>الآن جميع بياناتك محفوظة في قاعدة بيانات سحابية آمنة.</p>
          <ul style={{marginTop: '1rem', lineHeight: '2'}}>
            <li>✅ المنتجات: {products.length}</li>
            <li>✅ الموردين: {suppliers.length}</li>
            <li>✅ المتاجر: {buyers.length}</li>
            <li>✅ الطلبات: {orders.length}</li>
          </ul>
        </div>
      </div>
      {/* باقي واجهة المستخدم - نفس الكود الأصلي */}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
